<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Java Game on Browser</title>
    <!-- CheerpJ のランタイムを読み込む -->
    <script src="https://leaningtechnologies.com"></script>
</head>
<body>
    <!-- ゲーム画面を表示する要素 -->
    <div id="container" style="width: 800px; height: 600px;"></div>

    <script>
        // CheerpJの初期化
        cheerpjInit();
        // JARファイルを指定してメインクラスを実行（container要素内に描画）
        // ※「com.example.Main」はご自身のゲームのメインクラス名に書き換えてください
        cheerpjRunJar("/app/MyFirstShooting.jar", "jp.libroworks.FirstShooting", document.getElementById("container"));
    </script>
</body>
</html>
